services:
  # Any ONE backend at a time (they are alternative implementations of the
  # same API). Each keeps its SQLite file on a shared volume so the db
  # survives container rebuilds. Uncomment the one you want to run.
  backend-node:
    build: ./nodejs
    env_file:
      - ./nodejs/.env
    environment:
      SQLITE_PATH: /data/sqlite.db
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PORT: 5000
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - sqlite-data:/data

