  frontend:
    build:
      context: ./reactjs
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend-node

volumes:
  sqlite-data:
