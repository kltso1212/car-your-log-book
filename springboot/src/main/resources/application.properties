spring.application.name=springboot
# Docker provides PORT; default 5000 matches nodejs + reactjs defaults.
server.port=${PORT:5000}
# SQLite file. Local default ./fuel.db; in compose set SQLITE_PATH=/data/fuel.db
# (shared volume) so the db survives container rebuilds.
spring.datasource.url=jdbc:sqlite:${SQLITE_PATH:./fuel.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# SQLite is code-first: tables self-create on start.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jackson.date-format=yyyy-MM-dd
app.cors-origin=${CORS_ORIGIN:*}
