spring.application.name=springboot
# Docker provides PORT; default 5000 matches nodejs + reactjs defaults.
server.port=${PORT:5000}
# SQLite file. Local default ../sqlite.db (repo root, shared across backends);
# in compose set SQLITE_PATH=/data/sqlite.db (shared volume) so the db survives rebuilds.
spring.datasource.url=jdbc:sqlite:${SQLITE_PATH:../sqlite.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# SQLite is code-first: tables self-create on start.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
# Image uploads (nodejs parity): 10MB per file, 21MB so file + source fit one request.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=21MB
spring.jackson.date-format=yyyy-MM-dd
app.cors-origin=${CORS_ORIGIN:*}
